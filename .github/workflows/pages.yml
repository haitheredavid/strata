name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace snapshots hold real metadata and public/ is deployed as-is: never ship one.
      - name: No workspace snapshots in the repo
        run: |
          found=$(git ls-files -- '*.snapshot.json' '*.raw.json' 'snapshots/**')
          if [ -n "$found" ]; then
            echo "::error::Workspace exports must not be committed (real metadata):"
            echo "$found"
            exit 1
          fi
      - run: pnpm test
      # Served from https://<user>.github.io/<repo>/, so assets need the repo as base path.
      - run: pnpm exec tsc -b && pnpm exec vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
